[general]
layout = "scrolling"
xwayland = true
xwayland_native_resolution = false
xwayland_xsettings = true
# xwayland_scale = 1.0
# focus_follows_mouse = true
# adaptive_sync = false

exec_once = [
  "noctalia-shell",
  "systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP"
]

[appearance]
gaps_in = 6
gaps_out = 10
border_size = 2
# corner_radius = 10
# blur_enabled = true
# blur_radius = 8
# blur_passes = 2
# shadow_enabled = true

[binds]
"Super+Return" = "spawn wezterm"
"Super+E" = "spawn luciole"
"Super+B" = "spawn zen-browser"
"Super+Space" = "spawn noctalia-ipc launcher toggle"
"Super+Q" = "close_window"
# "Super+F" = "toggle_fullscreen"
# "Super+V" = "toggle_floating"
# "Super+L" = "spawn noctalia-ipc lockScreen lock"
