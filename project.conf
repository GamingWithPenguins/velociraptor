name: velociraptor
min-version: 2.2
element-path: elements

(@):
- junctions/freedesktop-sdk.bst:include/vars.yml
- junctions/freedesktop-sdk.bst:include/mirrors.yml

options:
  arch:
    type: arch
    description: Target system architecture
    variable: arch
    values:
    - x86_64
    - aarch64

  x86_64_v3:
    type: bool
    description: Enable x86-64-v3 microarchitecture baseline (matching Bluefin Dakota)
    default: true

variables:
  sysroot: "/"
  strip-binaries: ""
  (?):
  - arch == "x86_64" and x86_64_v3:
      target_flags_x86_64: "-march=x86-64-v3 -mtune=generic"

plugins:
- origin: junction
  junction: junctions/buildstream-plugins.bst
  elements:
  - autotools
  - cmake
  - make
  - meson
- origin: junction
  junction: junctions/bst-plugins-community.bst
  elements:
  - oci
  - pyproject
  sources:
  - cargo2
  - git_repo
  - git_tag

aliases:
  github: https://github.com/
  gitlab: https://gitlab.com/
  gnome: https://gitlab.gnome.org/GNOME/
  freedesktop: https://gitlab.freedesktop.org/
  srht: https://git.sr.ht/
  zen: https://github.com/zen-browser/desktop/releases/download/
  steam: https://repo.steampowered.com/steam/archive/stable/
