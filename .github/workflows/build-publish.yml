name: Build, Rechunk & Publish Single Gaming OCI

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-gaming-oci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build single unified gaming bootc OCI image via BuildStream 2
        run: |
          ./scripts/build-oci.sh testing

      - name: Rechunk OCI image into delta-friendly layers & lint
        run: |
          ./scripts/rechunk-oci.sh ./out/oci ./out/oci-rechunked

      - name: Generate SPDX SBOM with syft
        run: |
          syft "oci-dir:./out/oci-rechunked" -o spdx-json > ./out/velociraptor.spdx.json

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push OCI image & sign with cosign
        run: |
          skopeo copy oci:./out/oci-rechunked "docker://ghcr.io/velociraptor-os/velociraptor:testing"
          cosign sign --yes "ghcr.io/velociraptor-os/velociraptor:testing"
          cosign attest --yes --predicate ./out/velociraptor.spdx.json --type spdxjson "ghcr.io/velociraptor-os/velociraptor:testing"
